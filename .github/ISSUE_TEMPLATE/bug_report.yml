name: Bug report
description: Something in Daybar doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Daybar
        2. Switch to the week view
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Daybar version
      description: Find it in Settings, or right-click the menu bar icon and choose About Daybar.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: screens
    attributes:
      label: Screenshots or recordings
      description: Optional. Hide any event details you'd rather keep private.
